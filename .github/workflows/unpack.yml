name: Extract project archive

on:
  push:
    paths:
      - 'project.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire l'archive si présente
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -d .
            rm project.zip
            echo "extracted=true" >> $GITHUB_ENV
          else
            echo "extracted=false" >> $GITHUB_ENV
          fi
      - name: Committer les fichiers extraits
        if: env.extracted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extraction automatique du projet"
          git push
